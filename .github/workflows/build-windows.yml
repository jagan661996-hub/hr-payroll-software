name: Build Windows Installer

# This workflow is the actual path to a real HRPayrollSetup.exe.
# electron-builder needs a Windows filesystem/registry to produce an
# NSIS installer, which a Linux dev sandbox cannot do - so the build
# runs here, on GitHub's windows-latest runner, and the .exe is
# uploaded as a downloadable build artifact.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install all workspace dependencies
        run: npm install

      - name: Build client + server
        run: npm run build

      - name: Verify build output before packaging
        shell: bash
        run: |
          test -f server/dist/index.js || (echo "::error::server/dist/index.js was not created by the build step" && exit 1)
          find . -maxdepth 4 -type d -name "better-sqlite3" -not -path "*/node_modules/*/node_modules/*" || true
          find . -maxdepth 4 -type d -name "better-sqlite3" | grep -q . || (echo "::error::better-sqlite3 not found in any node_modules folder" && exit 1)
          echo "Pre-flight checks passed."

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRPayrollSetup
          path: installer/dist/*.exe
