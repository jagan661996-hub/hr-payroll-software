name: Build Windows Installer

# This workflow is the actual path to a real HRPayrollSetup.exe.
# electron-builder needs a Windows filesystem/registry to produce an
# NSIS installer, which a Linux dev sandbox cannot do - so the build
# runs here, on GitHub's windows-latest runner, and the .exe is
# uploaded as a downloadable build artifact.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install client dependencies
        run: npm install --workspace client

      - name: Install server dependencies
        run: npm install --workspace server

      - name: Build client + server
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HRPayrollSetup
          path: installer/dist/*.exe
